name: Starter
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
    visionOS: "1.0"
    watchOS: "10.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
configs:
  Debug: debug
  Release: release
packages:
  StarterPackage:
    path: .
targetTemplates:
  CrossAppleApp:
    type: application
    sources:
      - Sources/Application
      - Resources
    dependencies:
      - package: StarterPackage
        product: AppCore
    settings:
      base:
        PRODUCT_NAME: Starter
targets:
  Starter-iOS:
    templates: [CrossAppleApp]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.starter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  Starter-macOS:
    templates: [CrossAppleApp]
    platform: macOS
    entitlements:
      path: Config/Starter.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.starter.macos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Starter.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  Starter-tvOS:
    templates: [CrossAppleApp]
    platform: tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.starter.tv
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  Starter-visionOS:
    templates: [CrossAppleApp]
    platform: visionOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.starter.vision
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  Starter-watchOS:
    templates: [CrossAppleApp]
    platform: watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.starter.watch
        INFOPLIST_KEY_WKApplication: YES
schemes:
  Starter-iOS:
    build:
      targets:
        Starter-iOS: all
  Starter-macOS:
    build:
      targets:
        Starter-macOS: all
  Starter-tvOS:
    build:
      targets:
        Starter-tvOS: all
  Starter-visionOS:
    build:
      targets:
        Starter-visionOS: all
  Starter-watchOS:
    build:
      targets:
        Starter-watchOS: all
