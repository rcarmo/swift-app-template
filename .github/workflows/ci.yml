name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository checks
        run: make validate
      - name: Make workflow orchestration
        run: make workflow-test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap and build every Apple target
        run: make bootstrap-all
